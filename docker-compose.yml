services:
  ielts-prep-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ielts-prep-studio-app
    ports:
      - "0.0.0.0:${PORT:-8085}:80"
    volumes:
      - ./data/private:/app/data/private:ro
    environment:
      - PORT=80
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_DATABASE_ID=${CLOUDFLARE_DATABASE_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
      - GOOGLE_TOKEN_ENCRYPTION_KEY=${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
