services:
  ielts-prep-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ielts-prep-studio-app
    ports:
      - "127.0.0.1:${PORT:-8085}:80"
    environment:
      - PORT=80
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_DATABASE_ID=${CLOUDFLARE_DATABASE_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
